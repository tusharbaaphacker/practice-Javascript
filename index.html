<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            padding: 15px;
            color: white;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
        }
        .search-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        #searchBox {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }
        #searchBtn {
            padding: 10px;
            font-size: 16px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
        .product-list { 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            padding: 20px;
        }
        .product { 
            border: 1px solid #ccc; 
            padding: 10px; 
            text-align: center;
            background: #f9f9f9;
        }
        .product img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Cart</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Login</a></li>
        </ul>
        <div class="logo">MyShop</div>
    </div>

    <h1 style="text-align: center;">Product List</h1>
    <div class="search-container">
        <input type="text" id="searchBox" placeholder="Search by Product ID">
        <button id="searchBtn">Search</button>
    </div>
    <div id="product-list" class="product-list">
        <p class="loading">Loading...</p>
    </div>

    <script>
        const api = 'https://dummyjson.com/products';
        let productList = document.getElementById('product-list');
        let searchBox = document.getElementById('searchBox');
        let searchBtn = document.getElementById('searchBtn');
        let timeout;

        const fetchApi = async () => {
            try {
                let response = await fetch(api);
                let result = await response.json();
                displayProducts(result.products);
            } catch (err) {
                console.log(err);
                productList.innerHTML = '<p>Error fetching data</p>';
            }
        };

        const displayProducts = (products) => {
            productList.innerHTML = '';
            products.forEach(product => {
                let div = document.createElement('div');
                div.className = 'product';
                div.innerHTML = `
                    <img src="${product.thumbnail}" alt="${product.title}">
                    <p><strong>${product.id}</strong>: ${product.title}</p>
                `;
                productList.appendChild(div);
            });
        };

        const searchProduct = async () => {
            let searchTerm = searchBox.value.trim();
            if (searchTerm === '') {
                fetchApi();
                return;
            }
            try {
                let response = await fetch(`${api}/${searchTerm}`);
                if (!response.ok) throw new Error('Product not found');
                let product = await response.json();
                displayProducts([product]);
            } catch (err) {
                console.log(err);
                productList.innerHTML = '<p>Product not found</p>';
            }
        };


        const debouncedSearch = () => {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                searchProduct();
            }, 500);
        };

        searchBtn.addEventListener('click', searchProduct);

        fetchApi();
    </script>
</body>
</html>
