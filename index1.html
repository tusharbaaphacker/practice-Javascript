<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing with Shopping Cart</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        /* Custom styles for fixed cart */
        .cart-fixed {
            position: fixed;
            right: 20px;
            top: 70px;
            z-index: 50;
        }
        
        /* Add cursor pointer to all buttons */
        button {
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900">
   <header class="bg-white dark:bg-gray-800 shadow-md p-4 mb-6 sticky top-0 z-10">
       <div class="container mx-auto flex justify-between items-center">
           <!-- <h1 class="text-2xl font-bold text-gray-800 dark:text-white">TS Shop</h1> --><div class="bg-blue-500 text-white font-bold text-lg w-12 h-12 flex items-center justify-center rounded-lg shadow-lg">
    TS
</div>
    <p class="text-sm font-semibold mt-1">Shop</p>

           <div class="relative" id="cart-container">
               <button id="cart-button" class="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center">
                   <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
                   </svg>
                   Cart (<span id="cart-count">0</span>)
               </button>
               <div id="cart-dropdown" class="hidden w-72 bg-white dark:bg-gray-800 shadow-lg rounded-lg z-10">
                   <div class="p-4">
                       <h2 class="text-lg font-semibold text-gray-800 dark:text-white mb-2">Your Cart</h2>
                       <div id="cart-items" class="max-h-60 overflow-y-auto">
                           <!-- Cart items will be added here -->
                       </div>
                       <div id="cart-empty" class="text-gray-500 dark:text-gray-400 py-4 text-center">
                           Your cart is empty
                       </div>
                       <div id="cart-total" class="mt-2 pt-2 border-t border-gray-200 dark:border-gray-700">
                           <div class="flex justify-between items-center">
                               <span class="text-gray-600 dark:text-gray-300">Total:</span>
                               <span class="font-bold text-gray-800 dark:text-white">$<span id="total-price">0</span></span>
                           </div>
                           <button id="checkout-button" class="mt-3 w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition">
                               Checkout
                           </button>
                       </div>
                   </div>
               </div>
           </div>
       </div>
   </header>

   <div class="container mx-auto px-4">
       <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
           <!-- Products will be loaded here -->
       </div>
   </div>

   <script>
    // Cart state
    let cart = [];
    let isCartOpen = false;

    // DOM Elements
    const cartButton = document.getElementById('cart-button');
    const cartDropdown = document.getElementById('cart-dropdown');
    const cartContainer = document.getElementById('cart-container');
    const cartItemsContainer = document.getElementById('cart-items');
    const cartEmptyMessage = document.getElementById('cart-empty');
    const cartCount = document.getElementById('cart-count');
    const totalPrice = document.getElementById('total-price');
    const checkoutButton = document.getElementById('checkout-button');

    // Toggle cart dropdown
    cartButton.addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent event from bubbling up
        isCartOpen = !isCartOpen;
        updateCartVisibility();
    });

    // Function to update cart position and visibility
    function updateCartVisibility() {
        if (isCartOpen) {
            // Position cart dropdown properly
            const rect = cartButton.getBoundingClientRect();
            cartDropdown.classList.add('cart-fixed');
            cartDropdown.classList.remove('hidden');
        } else {
            cartDropdown.classList.add('hidden');
        }
    }

    // Prevent cart from closing when clicking inside the dropdown
    cartDropdown.addEventListener('click', (e) => {
        e.stopPropagation(); // Stop the click from reaching the document
    });

    // Close cart when clicking outside
    document.addEventListener('click', (event) => {
        if (isCartOpen) {
            isCartOpen = false;
            updateCartVisibility();
        }
    });

    // Update cart position on scroll
    window.addEventListener('scroll', () => {
        if (isCartOpen) {
            updateCartVisibility();
        }
    });

    // Add to cart function
    function addToCart(product) {
        // Check if product is already in cart
        const existingItem = cart.find(item => item.id === product.id);
        
        if (existingItem) {
            // Increase quantity if product already exists
            existingItem.quantity += 1;
        } else {
            // Add new product to cart
            cart.push({
                ...product,
                quantity: 1
            });
        }
        
        updateCart();
    }

    // Remove from cart function
    function removeFromCart(productId) {
        cart = cart.filter(item => item.id !== productId);
        updateCart();
    }

    // Update quantity function
    function updateQuantity(productId, newQuantity) {
        const item = cart.find(item => item.id === productId);
        
        if (item) {
            if (newQuantity <= 0) {
                removeFromCart(productId);
            } else {
                item.quantity = newQuantity;
                updateCart();
            }
        }
    }

    // Update cart UI
    function updateCart() {
        // Update cart count
        const totalItems = cart.reduce((total, item) => total + item.quantity, 0);
        cartCount.textContent = totalItems;
        
        // Calculate total price
        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        totalPrice.textContent = total.toFixed(2);
        
        // Show/hide empty cart message
        cartEmptyMessage.classList.toggle('hidden', cart.length > 0);
        
        // Render cart items
        cartItemsContainer.innerHTML = '';
        
        cart.forEach(item => {
            const cartItemElement = document.createElement('div');
            cartItemElement.className = 'flex items-center py-2 border-b border-gray-200 dark:border-gray-700 last:border-0';
            cartItemElement.innerHTML = `
                <img src="${item.thumbnail}" alt="${item.title}" class="w-12 h-12 object-cover rounded mr-2">
                <div class="flex-1 min-w-0">
                    <h3 class="text-sm font-medium text-gray-800 dark:text-white truncate">${item.title}</h3>
                    <div class="flex items-center mt-1">
                        <button class="decrease-quantity text-gray-500 bg-gray-200 dark:bg-gray-700 dark:text-gray-300 w-5 h-5 rounded flex items-center justify-center" data-id="${item.id}">-</button>
                        <span class="mx-2 text-sm text-gray-600 dark:text-gray-400">${item.quantity}</span>
                        <button class="increase-quantity text-gray-500 bg-gray-200 dark:bg-gray-700 dark:text-gray-300 w-5 h-5 rounded flex items-center justify-center" data-id="${item.id}">+</button>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-sm font-medium text-gray-800 dark:text-white">$${(item.price * item.quantity).toFixed(2)}</div>
                    <button class="remove-item text-xs text-red-500 hover:text-red-700" data-id="${item.id}">Remove</button>
                </div>
            `;
            cartItemsContainer.appendChild(cartItemElement);
        });
        
        // Add event listeners to cart item buttons
        document.querySelectorAll('.remove-item').forEach(button => {
            button.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent the click from closing the cart
                const id = parseInt(e.target.dataset.id);
                removeFromCart(id);
            });
        });
        
        document.querySelectorAll('.decrease-quantity').forEach(button => {
            button.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent the click from closing the cart
                const id = parseInt(e.target.dataset.id);
                const item = cart.find(item => item.id === id);
                if (item) updateQuantity(id, item.quantity - 1);
            });
        });
        
        document.querySelectorAll('.increase-quantity').forEach(button => {
            button.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent the click from closing the cart
                const id = parseInt(e.target.dataset.id);
                const item = cart.find(item => item.id === id);
                if (item) updateQuantity(id, item.quantity + 1);
            });
        });
    }

    // Checkout button event
    checkoutButton.addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent the click from closing the cart
        if (cart.length > 0) {
            alert('Proceeding to checkout with ' + cart.length + ' items');
            // Here you would typically redirect to a checkout page
            // For this demo, we'll just clear the cart
            cart = [];
            updateCart();
            isCartOpen = false;
            updateCartVisibility();
        }
    });

    // Fetch products from API
    const fetchApi = async () => {
        try {
            let response = await fetch("https://dummyjson.com/products");
            let result = await response.json();
            console.log(result.products);
            
            const productsList = document.getElementById("list");

            productsList.innerHTML = result.products.map((item) => `
                <div class="w-full bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700 flex flex-col">
                    <a href="#" class="block overflow-hidden h-48">
                        <img class="w-full h-full object-cover rounded-t-lg" src="${item.thumbnail}" alt="product image" />
                    </a>
                    <div class="px-5 py-4 flex-1 flex flex-col">
                        <a href="#" class="mb-2">
                            <h5 class="text-xl font-semibold tracking-tight text-gray-900 dark:text-white">${item.title}</h5>
                        </a>
                        <div class="flex items-center mt-1 mb-3">
                            <div class="flex items-center space-x-1 rtl:space-x-reverse">
                                ${Array(Math.floor(item.rating))
                                    .fill()
                                    .map(() => `
                                        <svg class="w-4 h-4 text-yellow-300" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 22 20">
                                            <path d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z"/>
                                        </svg>
                                    `)
                                    .join("")}
                                ${Array(5 - Math.floor(item.rating))
                                    .fill()
                                    .map(() => `
                                        <svg class="w-4 h-4 text-gray-200 dark:text-gray-600" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 22 20">
                                            <path d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z"/>
                                        </svg>
                                    `)
                                    .join("")}
                            </div>
                            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-sm dark:bg-blue-200 dark:text-blue-800 ms-3">${item.rating}</span>
                        </div>
                        <p class="text-sm text-gray-600 dark:text-gray-400 mb-3 flex-1 line-clamp-2">${item.description}</p>
                        <div class="flex items-center justify-between mt-auto">
                            <span class="text-2xl font-bold text-gray-900 dark:text-white">$${item.price}</span>
                            <button class="add-to-cart-btn text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800" data-id="${item.id}">
                                Add to cart
                            </button>
                        </div>
                    </div>
                </div>
            `).join("");

            // Add event listeners to all "Add to cart" buttons
            document.querySelectorAll('.add-to-cart-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevent the click from closing the cart
                    
                    // Get the button element (could be a child element that was clicked)
                    const buttonElement = e.target.closest('.add-to-cart-btn');
                    if (!buttonElement) return;
                    
                    // Get product ID from the data attribute
                    const productId = parseInt(buttonElement.dataset.id);
                    
                    // Find the full product data from the API result
                    const productData = result.products.find(item => item.id === productId);
                    
                    if (productData) {
                        addToCart(productData);
                        
                        // Visual feedback
                        buttonElement.textContent = "Added!";
                        setTimeout(() => {
                            buttonElement.textContent = "Add to cart";
                        }, 1000);
                    } else {
                        console.error("Product not found:", productId);
                    }
                });
            });

        } catch(err) { 
            console.log(err);
        }
    }

    // Function to convert dollar to rupees
    const dollarToRupees = (dollarAmount) => {
        const rupeeAmount = dollarAmount * 74.83;
        return rupeeAmount.toFixed(2);
    }

  
    // Initialize
    fetchApi();
    updateCart();
   </script>
</body>
</html>
