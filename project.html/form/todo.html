<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            min-height: 100vh;
            transition: background 0.5s ease-in-out;
        }
        .dark-mode {
            background: #1e1e1e;
            color: white;
        }
    </style>
</head>
<body class="text-gray-900 dark:text-gray-100">
    <nav class="w-full bg-blue-700 text-white p-4 flex justify-between items-center shadow-lg">
        <div class="flex gap-4">
            <button id="clearAll" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">🗑️ Clear All</button>
            <button id="showPending" class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600">⏳ Pending</button>
            <button id="showCompleted" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">✅ Completed</button>
        </div>
        <h1 class="text-3xl font-extrabold">🚀 Pro To-Do List</h1>
        <input type="file" id="audioFile" accept="audio/*" class="hidden">
        <button id="uploadAudio" class="bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600">🎵 Upload Audio</button>
        <button id="stopAudio" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 hidden">⏹ Stop Audio</button>
        <button id="themeToggle" class="bg-gray-200 text-black px-4 py-2 rounded-lg hover:bg-gray-300">🌙 Toggle Theme</button>
    </nav>
    <div class="container mx-auto p-6 w-full min-h-screen flex">
        <div class="bg-white dark:bg-gray-900 p-8 rounded-lg shadow-2xl border-4 border-blue-600 w-1/3">
            <h2 class="text-2xl font-bold text-blue-700 dark:text-blue-300 text-center mb-4">Add New Task</h2>
            <input id="taskInput" type="text" class="border-2 border-blue-500 p-3 w-full rounded-lg mb-2" placeholder="Enter Task">
            <input id="dueDate" type="date" class="border-2 border-blue-500 p-3 w-full rounded-lg mb-2">
            <input id="estimatedTime" type="number" class="border-2 border-blue-500 p-3 w-full rounded-lg mb-2" placeholder="Time (min)">
            <button id="addTask" class="bg-blue-500 text-white px-5 py-3 rounded-lg w-full mt-3 hover:bg-blue-600">➕ Add Task</button>
        </div>
        <div class="w-2/3 pl-6">
            <ul id="taskList" class="mt-6 space-y-3"></ul>
        </div>
    </div>
    <audio id="taskCompleteAudio"></audio>
    <script>
        $(document).ready(function () {
            $('#addTask').click(function () {
                let taskText = $('#taskInput').val();
                let dueDate = $('#dueDate').val();
                let estimatedTime = $('#estimatedTime').val();
                
                if (taskText !== '' && estimatedTime !== '') {
                    $('#taskList').append(`
                        <li class='p-4 border rounded-lg flex justify-between items-center bg-blue-500 text-white shadow-lg'>
                            <span>${taskText} (Due: ${dueDate}, ⏳ ${estimatedTime} min)</span>
                            <button class='completeTask bg-blue-700 px-3 py-2 rounded-lg'>✔️</button>
                            <button class='deleteTask bg-red-700 px-3 py-2 rounded-lg'>❌</button>
                        </li>`);
                    $('#taskInput').val('');
                    $('#estimatedTime').val('');
                }
            });
            
            $(document).on('click', '.deleteTask', function () {
                $(this).parent().remove();
            });
            
            $(document).on('click', '.completeTask', function () {
                $(this).parent().addClass('bg-gray-500 line-through');
                let audio = document.getElementById('taskCompleteAudio');
                if (audio.src) {
                    audio.play();
                    $('#stopAudio').removeClass('hidden');
                }
            });
            
            $('#clearAll').click(function () {
                $('#taskList').empty();
            });
            
            $('#showPending').click(function () {
                $('li').show();
                $('.bg-gray-500').hide();
            });
            
            $('#showCompleted').click(function () {
                $('li').hide();
                $('.bg-gray-500').show();
            });
            
            $('#themeToggle').click(function () {
                $('body').toggleClass('dark-mode dark');
                $(this).text($(this).text() === '🌙 Toggle Theme' ? '☀️ Toggle Theme' : '🌙 Toggle Theme');
            });
            
            $('#uploadAudio').click(function () {
                $('#audioFile').click();
            });
            
            $('#audioFile').change(function (event) {
                let file = event.target.files[0];
                if (file) {
                    let objectURL = URL.createObjectURL(file);
                    $('#taskCompleteAudio').attr('src', objectURL);
                }
            });
            
            $('#stopAudio').click(function () {
                let audio = document.getElementById('taskCompleteAudio');
                audio.pause();
                audio.currentTime = 0;
                $(this).addClass('hidden');
            });
        });
    </script>
</body>
</html>
